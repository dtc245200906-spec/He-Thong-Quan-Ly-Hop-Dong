
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sửa hợp đồng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }
        h1 {
            color: #1769aa;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button, a {
            display: inline-block;
            margin-top: 22px;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        button {
            background: #1769aa;
            color: white;
        }
        a {
            background: #ddd;
            color: black;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>SỬA HỢP ĐỒNG</h1>

    <form method="POST">
        <label>Mã hợp đồng</label>
        <input name="code" value="{{ contract.code }}" required>

        <label>Tên hợp đồng</label>
        <input name="name" value="{{ contract.name }}" required>

        <label>Đối tác</label>
        <input name="partner" value="{{ contract.partner }}" required>

        <label>Ngày ký</label>
        <input type="date" name="signed_date"
               value="{{ contract.signed_date }}" required>

        <label>Giá trị hợp đồng (VNĐ)</label>
        <input type="number" name="value" min="0" step="0.01"
               value="{{ contract.value }}" required>

        <label>Trạng thái</label>
        <select name="status">
            {% for status in ["Đang thực hiện", "Hoàn thành", "Đã hủy"] %}
            <option value="{{ status }}"
                {% if contract.status == status %}selected{% endif %}>
                {{ status }}
            </option>
            {% endfor %}
        </select>

        <button type="submit">Lưu thay đổi</button>
        <a href="/">Quay lại</a>
    </form>
</div>
</body>
</html>
